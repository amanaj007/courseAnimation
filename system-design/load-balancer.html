<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Load Balancer — System Design Animation</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    @media (max-width: 600px) {
      .stage { overflow-x:auto; padding:0.75rem 0.5rem; }
      #lb-svg { min-width:420px; }
      .algo-row { flex-wrap:wrap; gap:0.4rem; justify-content:center; }
      .algo-btn { font-size:0.75rem; padding:0.3rem 0.6rem; }
    }
  </style>
  <style>
    /* ── Diagram canvas ── */
    .diagram {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      position: relative;
    }

    svg#lb-svg {
      width: 100%;
      overflow: visible;
    }

    /* nodes */
    .node-box {
      rx: 12;
      ry: 12;
    }

    .node-label {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e8eaf6;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .node-sub {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 10px;
      fill: #8b8fa8;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    /* packet dot */
    .packet {
      r: 7;
    }

    /* server load bars */
    .load-bar-bg {
      rx: 3; ry: 3;
    }
    .load-bar-fill {
      rx: 3; ry: 3;
    }

    /* legend */
    .algo-legend {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
      justify-content: center;
    }

    .algo-btn {
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .algo-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .stats-row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.9rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-chip strong {
      color: var(--text);
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Anim<span>Studio</span></div>
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="../dsa/binary-search.html">DSA</a></li>
      <li><a href="load-balancer.html">System Design</a></li>
    </ul>
  </nav>

  <div class="anim-page">
    <a class="back-link" href="../index.html">← Back to Home</a>
    <h1>Load Balancer</h1>
    <p class="subtitle">Distributing traffic across backend servers</p>

    <div class="stage" style="flex-direction:column; gap:0;">
      <div class="diagram">
        <svg id="lb-svg" viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#2e3148"/>
            </marker>
          </defs>

          <!-- connection lines (drawn behind nodes) -->
          <!-- client → lb -->
          <line id="line-client-lb" x1="130" y1="170" x2="310" y2="170"
                stroke="#2e3148" stroke-width="2" stroke-dasharray="6 4"
                marker-end="url(#arrow)"/>
          <!-- lb → servers -->
          <line id="line-lb-s0" x1="510" y1="170" x2="640" y2="80"
                stroke="#2e3148" stroke-width="2" stroke-dasharray="6 4"
                marker-end="url(#arrow)"/>
          <line id="line-lb-s1" x1="510" y1="170" x2="640" y2="170"
                stroke="#2e3148" stroke-width="2" stroke-dasharray="6 4"
                marker-end="url(#arrow)"/>
          <line id="line-lb-s2" x1="510" y1="170" x2="640" y2="260"
                stroke="#2e3148" stroke-width="2" stroke-dasharray="6 4"
                marker-end="url(#arrow)"/>

          <!-- CLIENT node -->
          <rect x="20" y="140" width="110" height="60" rx="12" ry="12"
                fill="#1a1d27" stroke="#2e3148" stroke-width="2"/>
          <text x="75" y="164" class="node-label">Client</text>
          <text x="75" y="182" class="node-sub">Browser / App</text>

          <!-- LOAD BALANCER node -->
          <rect x="320" y="130" width="130" height="80" rx="12" ry="12"
                fill="#1a1d27" stroke="#6c63ff" stroke-width="2.5"/>
          <text x="385" y="160" class="node-label" fill="#a09cf7">Load Balancer</text>
          <text x="385" y="178" class="node-sub" id="lb-algo-label">Round Robin</text>
          <text x="385" y="194" class="node-sub" id="lb-req-count">Requests: 0</text>

          <!-- SERVER nodes -->
          <!-- S0 -->
          <rect id="srv-rect-0" x="660" y="50" width="140" height="60" rx="12" ry="12"
                fill="#1a1d27" stroke="#2e3148" stroke-width="2"/>
          <text x="730" y="73" class="node-label">Server A</text>
          <text x="730" y="89" class="node-sub" id="srv-sub-0">Requests: 0</text>
          <!-- load bar bg -->
          <rect x="665" y="103" width="130" height="6" rx="3" ry="3" fill="#2e3148"/>
          <rect id="lb-fill-0" x="665" y="103" width="0" height="6" rx="3" ry="3" fill="#6c63ff"/>

          <!-- S1 -->
          <rect id="srv-rect-1" x="660" y="140" width="140" height="60" rx="12" ry="12"
                fill="#1a1d27" stroke="#2e3148" stroke-width="2"/>
          <text x="730" y="163" class="node-label">Server B</text>
          <text x="730" y="179" class="node-sub" id="srv-sub-1">Requests: 0</text>
          <rect x="665" y="193" width="130" height="6" rx="3" ry="3" fill="#2e3148"/>
          <rect id="lb-fill-1" x="665" y="193" width="0" height="6" rx="3" ry="3" fill="#ff6584"/>

          <!-- S2 -->
          <rect id="srv-rect-2" x="660" y="230" width="140" height="60" rx="12" ry="12"
                fill="#1a1d27" stroke="#2e3148" stroke-width="2"/>
          <text x="730" y="253" class="node-label">Server C</text>
          <text x="730" y="269" class="node-sub" id="srv-sub-2">Requests: 0</text>
          <rect x="665" y="283" width="130" height="6" rx="3" ry="3" fill="#2e3148"/>
          <rect id="lb-fill-2" x="665" y="283" width="0" height="6" rx="3" ry="3" fill="#43e97b"/>

          <!-- Animated packet -->
          <circle id="packet" cx="-50" cy="170" r="7" fill="#ffd700" opacity="0"/>
        </svg>
      </div>
    </div>

    <!-- algorithm selector -->
    <div class="algo-legend">
      <button class="algo-btn active" data-algo="rr">Round Robin</button>
      <button class="algo-btn" data-algo="random">Random</button>
      <button class="algo-btn" data-algo="lc">Least Connections</button>
    </div>

    <div class="stats-row">
      <div class="stat-chip">Server A: <strong id="chip-0">0 req</strong></div>
      <div class="stat-chip">Server B: <strong id="chip-1">0 req</strong></div>
      <div class="stat-chip">Server C: <strong id="chip-2">0 req</strong></div>
    </div>

    <div class="controls">
      <button class="btn primary" id="btn-send">▶ Send Request</button>
      <button class="btn" id="btn-auto">↻ Loop: Off</button>
      <button class="btn" id="btn-reset">↺ Reset</button>
    </div>

    <div class="info-box" id="info-box">
      Press <strong>Send Request</strong> to send a client request through the load balancer.
    </div>
  </div>

  <footer>Built with GSAP &mdash; Course Animations</footer>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    /* ── State ── */
    const serverNames  = ['Server A', 'Server B', 'Server C'];
    const serverColors = ['#6c63ff', '#ff6584', '#43e97b'];
    // SVG center-points for each server's rect
    const serverPoints = [
      { x: 660, y: 80  },
      { x: 660, y: 170 },
      { x: 660, y: 260 },
    ];
    const LB_ENTRY  = { x: 510, y: 170 };
    const LB_EXIT   = { x: 320, y: 170 };  // unused, packet goes client→LB→server
    const CLIENT_PT = { x: 130, y: 170 };

    let algo      = 'rr';
    let rrIndex   = 0;
    let reqCounts = [0, 0, 0];
    let totalReqs = 0;
    let animating = false;
    let autoTimer = null;
    let autoOn = false;

    const packet      = document.getElementById('packet');
    const infoBox     = document.getElementById('info-box');
    const lbReqLabel  = document.getElementById('lb-req-count');
    const algoLabel   = document.getElementById('lb-algo-label');
    const MAX_BAR     = 130; // px width for full load bar

    /* ── Algorithm ── */
    const algoNames = { rr: 'Round Robin', random: 'Random', lc: 'Least Connections' };

    function pickServer() {
      if (algo === 'rr') {
        const s = rrIndex;
        rrIndex = (rrIndex + 1) % 3;
        return s;
      }
      if (algo === 'random') {
        return Math.floor(Math.random() * 3);
      }
      if (algo === 'lc') {
        const mn = Math.min(...reqCounts);
        const ties = reqCounts.reduce((a, v, i) => v === mn ? [...a, i] : a, []);
        return ties[Math.floor(Math.random() * ties.length)];
      }
    }

    /* ── DOM refs ── */
    const srvRects = [
      document.getElementById('srv-rect-0'),
      document.getElementById('srv-rect-1'),
      document.getElementById('srv-rect-2'),
    ];
    const lbFills  = [
      document.getElementById('lb-fill-0'),
      document.getElementById('lb-fill-1'),
      document.getElementById('lb-fill-2'),
    ];
    const srvSubs  = [
      document.getElementById('srv-sub-0'),
      document.getElementById('srv-sub-1'),
      document.getElementById('srv-sub-2'),
    ];
    const chips = [
      document.getElementById('chip-0'),
      document.getElementById('chip-1'),
      document.getElementById('chip-2'),
    ];

    /* ── Update UI after routing ── */
    function updateServerUI(idx) {
      const count = reqCounts[idx];
      const maxCount = Math.max(...reqCounts, 1);
      srvSubs[idx].textContent  = `Requests: ${count}`;
      chips[idx].textContent    = `${count} req`;

      // update all bars relative to max
      reqCounts.forEach((c, i) => {
        const w = (c / (maxCount > 10 ? maxCount : 10)) * MAX_BAR;
        gsap.to(lbFills[i], { attr: { width: Math.max(w, 0) }, duration: 0.4, ease: 'power2.out' });
      });

      lbReqLabel.textContent = `Requests: ${totalReqs}`;
    }

    /* ── Animate packet ── */
    function sendRequest() {
      if (animating) return;
      animating = true;

      const srv = pickServer();
      const dest = serverPoints[srv];

      // reset packet position to client
      gsap.set(packet, { attr: { cx: CLIENT_PT.x, cy: CLIENT_PT.y }, opacity: 1, fill: '#ffd700' });

      // flash LB on route decision
      const lbFlash = () => {
        gsap.fromTo('#lb-svg rect[stroke="#6c63ff"]',
          { attr: { stroke: '#fff' } },
          { attr: { stroke: '#6c63ff' }, duration: 0.3 }
        );
      };

      // phase 1: client → LB center
      gsap.to(packet, {
        attr: { cx: (LB_EXIT.x + LB_ENTRY.x) / 2 + 30, cy: 170 },
        duration: 0.45,
        ease: 'power2.in',
        onComplete: () => {
          lbFlash();
          // phase 2: LB → server
          gsap.to(packet, {
            attr: { cx: dest.x + 10, cy: dest.y },
            duration: 0.5,
            ease: 'power2.out',
            fill: serverColors[srv],
            onStart: () => {
              gsap.set(packet, { fill: serverColors[srv] });
            },
            onComplete: () => {
              // pulse on server
              gsap.fromTo(srvRects[srv],
                { attr: { stroke: '#fff' } },
                { attr: { stroke: '#2e3148' }, duration: 0.5,
                  onStart: () => {
                    srvRects[srv].setAttribute('stroke', '#fff');
                    reqCounts[srv]++;
                    totalReqs++;
                    updateServerUI(srv);
                  }
                }
              );
              // fade packet
              gsap.to(packet, { opacity: 0, duration: 0.3, delay: 0.2,
                onComplete: () => {
                  animating = false;
                }
              });
              infoBox.innerHTML = `Request <strong>#${totalReqs}</strong> routed to <strong style="color:${serverColors[srv]}">${serverNames[srv]}</strong> via <em>${algoNames[algo]}</em>.`;
            }
          });
        }
      });
    }

    /* ── Controls ── */
    document.getElementById('btn-send').addEventListener('click', sendRequest);

    document.getElementById('btn-auto').addEventListener('click', () => {
      autoOn = !autoOn;
      const btn = document.getElementById('btn-auto');
      btn.textContent = autoOn ? '↻ Loop: On' : '↻ Loop: Off';
      btn.classList.toggle('primary', autoOn);
      if (autoOn) { autoTimer = setInterval(sendRequest, 1100); }
      else { clearInterval(autoTimer); }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      clearInterval(autoTimer);
      autoOn = false;
      animating = false;
      document.getElementById('btn-auto').textContent = '↻ Loop: Off';
      document.getElementById('btn-auto').classList.remove('primary');
      rrIndex   = 0;
      reqCounts = [0, 0, 0];
      totalReqs = 0;
      gsap.set(packet, { opacity: 0 });
      lbReqLabel.textContent = 'Requests: 0';
      [0, 1, 2].forEach(i => {
        srvSubs[i].textContent = 'Requests: 0';
        chips[i].textContent   = '0 req';
        gsap.to(lbFills[i], { attr: { width: 0 }, duration: 0.3 });
        srvRects[i].setAttribute('stroke', '#2e3148');
      });
      infoBox.innerHTML = 'Press <strong>Send Request</strong> to send a client request through the load balancer.';
    });

    /* ── Algo selector ── */
    document.querySelectorAll('.algo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.algo-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        algo = btn.dataset.algo;
        algoLabel.textContent = algoNames[algo];
        rrIndex = 0;
      });
    });
  </script>

</body>
</html>
